name: Baixar fotos do dia

on:
  push:
    paths:
      - "pedidos/*.json"
  workflow_dispatch:
    inputs:
      pedido:
        description: "Arquivo do pedido (ex: pedidos/2026-10-09.json)"
        required: true

permissions:
  contents: write

concurrency:
  group: fotos
  cancel-in-progress: false

jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 pillow

      - name: Descobrir pedidos pendentes
        id: pedidos
        run: |
          LISTA=""
          if [ -n "${{ github.event.inputs.pedido }}" ]; then
            LISTA="${{ github.event.inputs.pedido }}"
          else
            for f in pedidos/*.json; do
              d=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['date'])" "$f")
              [ -f "fotos/$d/status.json" ] || LISTA="$LISTA $f"
            done
          fi
          echo "Pedidos pendentes: $LISTA"
          echo "lista=$LISTA" >> "$GITHUB_OUTPUT"

      - name: Baixar e gerar imagens
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
        run: |
          for p in ${{ steps.pedidos.outputs.lista }}; do
            echo "== $p"
            python baixar.py "$p"
          done

      - name: Salvar no repositorio
        run: |
          git config user.name "loucas-bot"
          git config user.email "loucas-bot@users.noreply.github.com"
          git add fotos
          if git diff --cached --quiet; then echo "nada novo"; exit 0; fi
          git commit -m "fotos:${{ steps.pedidos.outputs.lista }}"
          for i in 1 2 3 4 5; do
            if git pull --rebase && git push; then exit 0; fi
            sleep 5
          done
          echo "push falhou" && exit 1
